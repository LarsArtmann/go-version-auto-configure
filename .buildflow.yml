# Project-specific BuildFlow overrides (non-default information only).
skip_steps:
  # Tug-of-war guard (2026-09-18): go-mod-update raises the go directive to
  # dependency patch floors (go 1.26 -> go 1.26.7), which this repo's own
  # tool then strips back. Until the fleet minor decision lands
  # (TODO_LIST.md T4) and supply-side libs re-tag with major.minor-only
  # floors, dependency updates here would fight the version-surface policy.
  # Dependency freshness still comes from dependabot's weekly grouped PRs.
  - go-mod-update
  # go-structure-linter's go-version rule demands bumping to 1.27.1 whenever
  # a newer Go exists — the exact accidental-minor policy this repo exists to
  # police (TODO_LIST.md T4). Its remaining checks here are cosmetic
  # (.editorconfig, .gitattributes warnings); golangci config is generated by
  # golangci-lint-auto-configure, linting runs via the golangci-lint step.
  - go-structure-linter
  # cqrs-lint A009/A018 fire even for projects that import no go-cqrs-lite
  # (verified 2026-09-22: zero matches in go.mod and go.sum). The linter
  # cannot yet skip non-consumers; revisit if that changes.
  - cqrs-lint

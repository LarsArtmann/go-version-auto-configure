  # fleet minor decision landed (ADR-0001: 1.27) and the supply-side campaign
  # re-tagged, but BuildFlow's update/normalize dispositions still fight the
  # version-surface policy (go line flipped 20x in 20 commits, 2026-10-02) —
  # alignment tracked in TODO_LIST.md T16. Dependency freshness still comes
  # from dependabot's weekly grouped PRs.
  - go-mod-update
  # go-structure-linter's go-version rule demands bumping to 1.27.1 whenever
  # a newer Go exists — the exact accidental-minor policy this repo exists to
  # police (ADR-0001 keeps the fleet at minor form). Its remaining checks here
  # are cosmetic (.editorconfig, .gitattributes warnings); golangci config is
  # generated by golangci-lint-auto-configure, linting runs via the

version: 2

project_name: go-version-auto-configure

builds:
  - id: gvac
    main: ./cmd/go-version-auto-configure
    binary: go-version-auto-configure
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/larsartmann/go-version-auto-configure/pkg/version.injected={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

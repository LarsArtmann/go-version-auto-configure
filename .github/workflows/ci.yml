name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GOEXPERIMENT: jsonv2

jobs:
  verify:
    name: Build, test (race), lint, dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          args: --timeout 5m

      - name: Dogfood check (this repo must be clean)
        run: |
          go build -o /tmp/gvac ./cmd/go-version-auto-configure
          /tmp/gvac check --quiet --expect-minor 1.27 .

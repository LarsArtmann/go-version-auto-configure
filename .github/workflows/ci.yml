name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GOEXPERIMENT: jsonv2

jobs:
  verify:
    name: Build, test (race), lint, dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout 5m

      - name: Dogfood check (this repo must be clean)
        run: |
          go build -o /tmp/gvac ./cmd/go-version-auto-configure
          /tmp/gvac check --quiet --expect-minor 1.27 .
